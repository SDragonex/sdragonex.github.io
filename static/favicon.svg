<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" stroke="#222" stroke-width="1.5"/>
  <!-- Accent dot/flame -->
  <circle cx="50" cy="16" r="4.5" fill="#ED2100"/>
  <!-- DC Monogram -->
  <text x="11" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">D<tspan fill="#ED2100">C</tspan></text>
</svg>
